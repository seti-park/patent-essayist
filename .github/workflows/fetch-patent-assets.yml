# Utility: fetch public patent assets (grant PDF + drawing-sheet PNGs) from a
# GitHub-hosted runner and commit them to the calling branch. Exists because the
# pipeline's sandbox egress cannot reach USPTO/patentimages directly; runners can.
name: fetch-patent-assets

# push trigger: dispatch-only workflows on non-default branches are not
# registered by GitHub, so the first push of this file runs the fetch with the
# env defaults below; later runs can use workflow_dispatch.
on:
  push:
    paths:
      - ".github/workflows/fetch-patent-assets.yml"
  workflow_dispatch:
    inputs:
      patent_num:
        description: "Patent number, digits only (e.g. 12361091)"
        required: true
      pub_id:
        description: "Publication id used by patentimages (e.g. US12361091B1)"
        required: true
      grant_date:
        description: "Grant date YYYYMMDD used in sheet filenames (e.g. 20250715)"
        required: true
      dest:
        description: "Directory (repo-relative) to commit assets into"
        required: true
        default: "input-assets/patent"

env:
  PATENT_NUM: ${{ inputs.patent_num || '12361091' }}
  PUB_ID: ${{ inputs.pub_id || 'US12361091B1' }}
  GRANT_DATE: ${{ inputs.grant_date || '20250715' }}
  DEST: ${{ inputs.dest || 'input-assets/us12361091' }}

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch grant PDF (patent_client -> pat2pdf -> FPO fallbacks)
        run: |
          set -u
          mkdir -p "$DEST"
          cd "$DEST"
          PDF="US${PATENT_NUM}.pdf"

          echo "== strategy 1: patent_client (USPTO Patent Public Search)"
          pip install --quiet patent-client 2>/dev/null || echo "pip install failed"
          python3 - <<'PY' || echo "patent_client strategy failed"
          import os
          num = os.environ["PATENT_NUM"]
          from patent_client import PublicSearchDocument
          doc = PublicSearchDocument.objects.get(num)
          doc.download_images(path=".")
          print("patent_client ok")
          PY
          # patent_client names the file variously; normalize
          found=$(ls -S *.pdf 2>/dev/null | head -1 || true)
          if [ -n "$found" ] && [ "$found" != "$PDF" ]; then mv "$found" "$PDF"; fi

          if [ ! -s "$PDF" ]; then
            echo "== strategy 2: pat2pdf.org"
            page=$(curl -fsSL -A "Mozilla/5.0" "https://www.pat2pdf.org/pat2pdf/foo.pl?number=${PATENT_NUM}" || true)
            link=$(echo "$page" | grep -oE 'https?://[^"]*pat[0-9A-Za-z]*\.pdf' | head -1 || true)
            [ -n "$link" ] && curl -fsSL -A "Mozilla/5.0" -o "$PDF" "$link" || echo "pat2pdf failed"
          fi

          if [ ! -s "$PDF" ]; then
            echo "== strategy 3: freepatentsonline"
            curl -fsSL -A "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0 Safari/537.36" \
              -e "https://www.freepatentsonline.com/${PATENT_NUM}.html" \
              -o "$PDF" "https://www.freepatentsonline.com/${PATENT_NUM}.pdf" || { echo "FPO failed"; rm -f "$PDF"; }
          fi

          echo "== bonus: patentimages sheets with browser headers"
          n=0; miss=0
          while [ "$miss" -lt 2 ] && [ "$n" -lt 60 ]; do
            f=$(printf 'US%s-%s-D%05d.png' "$PATENT_NUM" "$GRANT_DATE" "$n")
            if curl -fsSL --retry 1 -o "$f" \
                 -A "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0 Safari/537.36" \
                 -H "Referer: https://patents.google.com/" \
                 -H "Accept: image/avif,image/webp,image/png,image/*;q=0.8" \
                 "https://patentimages.storage.googleapis.com/${PUB_ID}/$f"; then
              file "$f" | grep -q "PNG image" && { echo "got $f"; miss=0; } || { rm -f "$f"; miss=$((miss+1)); }
            else
              rm -f "$f"; miss=$((miss+1))
            fi
            n=$((n+1))
          done

          ls -la
          [ -s "$PDF" ] || ls *.png >/dev/null 2>&1 || { echo "ALL STRATEGIES FAILED"; exit 1; }

      - name: Commit assets to this branch
        run: |
          set -eu
          git config user.name "patent-asset-fetcher[bot]"
          git config user.email "actions@users.noreply.github.com"
          git add "$DEST"
          if git diff --cached --quiet; then
            echo "nothing fetched — failing so the caller notices"
            exit 1
          fi
          git commit -m "Fetch patent assets for US${PATENT_NUM} (${PUB_ID})"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
